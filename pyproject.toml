[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyConDec"
version = "0.0.1"
description = "Module for conditional decorators in Python"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Enrico Skoruppa", email = "esk.phys@gmail.com" }
]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
numba = ["numba"]

[project.urls]
Homepage = "https://github.com/eskoruppa/pyConDec"
Repository = "https://github.com/eskoruppa/pyConDec"
